sec:
  request_delay_seconds: 0.2   # SEC allows at most 10 requests per second
  timeout_seconds: 30

data:
  raw_dir: data/raw
  processed_dir: data/processed

download:
  form: 10-K
  filings_per_company: 2
  tickers: [AAPL, MSFT, NVDA, AMZN, GOOGL, JPM, GS, JNJ, PFE, TSLA]

chunking:
  chunk_chars: 2400      # about 600 tokens (roughly 4 characters per token)
  overlap_chars: 400     # about 100 tokens repeated between neighbouring chunks
  min_chars: 300         # smaller pieces get merged into the next chunk
  repeat_limit: 20       # a short line seen this often is a page header or footer
  skip_items: ["15", "16"]   # exhibit lists and summaries: no useful content

embedding:
  model_name: BAAI/bge-small-en-v1.5
  batch_size: 32
  # BGE models search better when the question (not the chunks) gets this prefix
  query_prefix: "Represent this sentence for searching relevant passages: "

retrieval:
  candidates: 50   # how many results each search method passes to the fusion step
  rrf_k: 60        # standard RRF constant; higher = less weight on any single #1
  top_k: 5         # how many final results to return
  dense_weight: 2.0  # RRF weight for the dense list
  bm25_weight: 1.0   # RRF weight for the BM25 list

reranker:
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2   # small and fast; compare with BAAI/bge-reranker-base
  batch_size: 32


